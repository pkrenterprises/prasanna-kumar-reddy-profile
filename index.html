    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family:
                Inter,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Arial,
                sans-serif;

            line-height: 1.6;

            color: #172033;

            background: #f7f9fc;
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        img {
            max-width: 100%;
            display: block;
        }

        .container {
            width: min(1120px, 92%);
            margin: auto;
        }


        /* =====================================================
           HEADER
           ===================================================== */

        header {
            position: sticky;
            top: 0;

            z-index: 1000;

            background:
                rgba(255,255,255,0.97);

            border-bottom:
                1px solid #e7eaf0;

            backdrop-filter:
                blur(12px);
        }

        .nav {
            min-height: 72px;

            display: flex;

            align-items: center;

            justify-content: space-between;

            gap: 25px;
        }

        .brand {
            font-size: 1.1rem;

            font-weight: 800;

            letter-spacing: -0.4px;

            color: #101828;
        }

        nav {
            display: flex;

            gap: 22px;

            flex-wrap: wrap;

            justify-content: flex-end;
        }

        nav a {
            font-size: 0.9rem;

            font-weight: 600;

            color: #475467;
        }

        nav a:hover {
            color: #101828;
        }


        /* =====================================================
           HERO
           ===================================================== */

        .hero {
            padding:
                90px 0 80px;

            background:
                radial-gradient(
                    circle at top right,
                    #e7eefc,
                    transparent 40%
                ),

                linear-gradient(
                    135deg,
                    #ffffff,
                    #f5f7fb
                );
        }

        .hero-grid {
            display: grid;

            grid-template-columns:
                0.9fr 1.4fr;

            align-items: center;

            gap: 65px;
        }

        .profile-image {
            width:
                min(360px, 80vw);

            aspect-ratio: 1;

            object-fit: cover;

            margin: auto;

            border-radius: 28px;

            border:
                8px solid white;

            box-shadow:
                0 25px 70px
                rgba(16,24,40,0.15);
        }

        .eyebrow {
            display: inline-block;

            margin-bottom: 15px;

            font-size: 0.82rem;

            font-weight: 800;

            text-transform: uppercase;

            letter-spacing: 1.5px;

            color: #667085;
        }

        h1 {
            font-size:
                clamp(2.5rem, 6vw, 5rem);

            line-height: 1.02;

            letter-spacing: -3px;

            margin-bottom: 20px;

            color: #101828;
        }

        .hero h2 {
            font-size:
                clamp(1.2rem, 2vw, 1.6rem);

            color: #344054;

            margin-bottom: 20px;
        }

        .hero p {
            max-width: 720px;

            font-size: 1.08rem;

            color: #667085;
        }

        .buttons {
            display: flex;

            flex-wrap: wrap;

            gap: 12px;

            margin-top: 28px;
        }

        .button {
            padding:
                12px 20px;

            border-radius: 12px;

            font-weight: 700;

            border:
                1px solid #d0d5dd;

            background: white;
        }

        .button.primary {
            background: #101828;

            color: white;

            border-color: #101828;
        }


        /* =====================================================
           SECTIONS
           ===================================================== */

        section {
            padding:
                80px 0;
        }

        .section-title {
            margin-bottom: 35px;
        }

        .section-title span {
            display: block;

            font-size: 0.78rem;

            font-weight: 800;

            letter-spacing: 1.5px;

            text-transform: uppercase;

            color: #667085;

            margin-bottom: 8px;
        }

        .section-title h2 {
            font-size:
                clamp(2rem, 4vw, 3rem);

            letter-spacing: -1.5px;

            color: #101828;
        }

        .section-title p {
            margin-top: 10px;

            max-width: 760px;

            color: #667085;
        }


        /* =====================================================
           CARDS
           ===================================================== */

        .cards {
            display: grid;

            grid-template-columns:
                repeat(3, 1fr);

            gap: 22px;
        }

        .card {
            background: white;

            border:
                1px solid #eaecf0;

            border-radius: 20px;

            padding: 28px;

            box-shadow:
                0 10px 35px
                rgba(16,24,40,0.04);
        }

        .card h3 {
            margin-bottom: 10px;

            color: #101828;
        }

        .card p {
            color: #667085;
        }

        .card .label {
            font-size: 0.76rem;

            font-weight: 800;

            letter-spacing: 1px;

            text-transform: uppercase;

            color: #98a2b3;

            margin-bottom: 7px;
        }


        /* =====================================================
           ABOUT
           ===================================================== */

        .about-grid {
            display: grid;

            grid-template-columns:
                1fr 1fr;

            gap: 45px;

            align-items: start;
        }

        .about-text p {
            color: #667085;

            margin-bottom: 16px;
        }

        .facts {
            display: grid;

            gap: 12px;
        }

        .fact {
            background: white;

            border:
                1px solid #eaecf0;

            padding:
                17px 20px;

            border-radius: 14px;
        }

        .fact strong {
            display: block;

            font-size: 0.78rem;

            text-transform: uppercase;

            letter-spacing: 0.8px;

            color: #98a2b3;

            margin-bottom: 4px;
        }


        /* =====================================================
           ORGANIZATIONS
           ===================================================== */

        .org-card {
            position: relative;

            overflow: hidden;
        }

        .org-card h3 {
            font-size: 1.45rem;
        }

        .role {
            font-weight: 700;

            color: #344054;

            margin-bottom: 12px;
        }

        .org-list {
            list-style: none;

            margin-top: 18px;
        }

        .org-list li {
            padding: 8px 0;

            border-bottom:
                1px solid #f2f4f7;

            color: #667085;
        }


        /* =====================================================
           TIMELINE
           ===================================================== */

        .timeline {
            max-width: 850px;
        }

        .timeline-item {
            position: relative;

            padding:
                0 0 30px 28px;

            border-left:
                2px solid #d0d5dd;
        }

        .timeline-item:last-child {
            border-left-color:
                transparent;
        }

        .timeline-item::before {
            content: "";

            position: absolute;

            left: -7px;

            top: 4px;

            width: 12px;

            height: 12px;

            border-radius: 50%;

            background: #101828;
        }

        .timeline-year {
            font-size: 0.82rem;

            font-weight: 800;

            color: #667085;

            margin-bottom: 5px;
        }
